name: Repair production order tracking

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/relaydesk' }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts

      - name: Repair and verify order tracking schema
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -s -- '$VPS_DEPLOY_PATH'" <<'REMOTE'
          set -Eeuo pipefail
          cd "$1/current"
          docker compose -p relaydesk exec -T postgres sh -lc '
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'"'"'SQL'"'"'
          BEGIN;
          ALTER TABLE orders ADD COLUMN IF NOT EXISTS updated_at timestamptz NOT NULL DEFAULT now();
          ALTER TABLE orders ADD COLUMN IF NOT EXISTS tracking_carrier text;
          ALTER TABLE orders ADD COLUMN IF NOT EXISTS tracking_number text;
          ALTER TABLE orders ADD COLUMN IF NOT EXISTS tracking_url text;
          ALTER TABLE orders ADD COLUMN IF NOT EXISTS paypal_tracking_synced_at timestamptz;
          ALTER TABLE orders DROP CONSTRAINT IF EXISTS orders_tracking_complete_check;
          ALTER TABLE orders ADD CONSTRAINT orders_tracking_complete_check CHECK (
            (tracking_carrier IS NULL AND tracking_number IS NULL AND tracking_url IS NULL)
            OR (tracking_carrier IS NOT NULL AND tracking_number IS NOT NULL)
          );
          COMMIT;
          SELECT column_name
          FROM information_schema.columns
          WHERE table_schema = '"'"'public'"'"' AND table_name = '"'"'orders'"'"'
            AND column_name IN ('"'"'updated_at'"'"','"'"'tracking_carrier'"'"','"'"'tracking_number'"'"','"'"'tracking_url'"'"','"'"'paypal_tracking_synced_at'"'"')
          ORDER BY column_name;
          SQL
          '
          docker compose -p relaydesk restart api
          docker compose -p relaydesk ps api
          REMOTE
