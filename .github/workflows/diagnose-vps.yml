name: Diagnose production CRM

on:
  workflow_dispatch:
    inputs:
      tts_account_id:
        description: Optional WhatsApp account UUID for a TTS provider smoke test
        required: false
        type: string
      translation_message_id:
        description: Optional incoming audio message UUID to transcribe and translate
        required: false
        type: string
      contact_phone:
        description: Optional E.164 contact phone for identity diagnostics
        required: false
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/relaydesk' }}
      TTS_ACCOUNT_ID: ${{ inputs.tts_account_id }}
      TRANSLATION_MESSAGE_ID: ${{ inputs.translation_message_id }}
      CONTACT_PHONE: ${{ inputs.contact_phone }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          if test -n "$TTS_ACCOUNT_ID"; then
            [[ "$TTS_ACCOUNT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          fi
          if test -n "$TRANSLATION_MESSAGE_ID"; then
            [[ "$TRANSLATION_MESSAGE_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          fi
          if test -n "$CONTACT_PHONE"; then
            [[ "$CONTACT_PHONE" =~ ^\+[1-9][0-9]{6,14}$ ]]
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts

      - name: Inspect CRM schema and endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -s -- '$VPS_DEPLOY_PATH' '$TTS_ACCOUNT_ID' '$TRANSLATION_MESSAGE_ID' '$CONTACT_PHONE'" <<'REMOTE'
          set -Eeuo pipefail
          root=$1
          tts_account_id=${2:-}
          translation_message_id=${3:-}
          contact_phone=${4:-}
          cd "$root/current"

          echo "Current release: $(basename "$(readlink -f "$root/current")")"
          ls -ld "$root/current"
          readlink "$root/current" || true
          docker compose -p relaydesk ps
          docker inspect relaydesk-api-1 --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}'
          docker compose -p relaydesk exec -T postgres sh -lc \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT current_database(); SELECT to_regclass('"'"'public.order_items'"'"'),to_regclass('"'"'public.order_fees'"'"'); SELECT string_agg(column_name,'"'"','"'"' ORDER BY column_name) FROM information_schema.columns WHERE table_schema='"'"'public'"'"' AND table_name='"'"'orders'"'"' AND column_name IN ('"'"'status'"'"','"'"'translate_on_send'"'"','"'"'target_language'"'"','"'"'translated_text'"'"','"'"'sent_at'"'"');"' \
            </dev/null

          if test -n "$contact_phone"; then
            docker compose -p relaydesk exec -T -e CONTACT_PHONE="$contact_phone" postgres sh -lc \
              'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -v phone="$CONTACT_PHONE" <<'"'"'SQL'"'"
SELECT co.id,co.account_id,co.provider_user_id,co.phone_e164,quote_nullable(co.display_name) display_name,quote_nullable(co.alias) alias,co.last_seen_at,co.updated_at,c.id conversation_id,c.last_message_direction,c.last_message_at
FROM contacts co LEFT JOIN conversations c ON c.contact_id=co.id
WHERE co.phone_e164=:'"'"'phone'"'"' OR co.provider_user_id IN (replace(:'"'"'phone'"'"','"'"'+'"'"','"'"''"'"')||'"'"'@s.whatsapp.net'"'"')
ORDER BY co.updated_at DESC;

SELECT msg.id,msg.direction,msg.sender_provider_user_id,quote_nullable(msg.sender_display_name) sender_name,msg.status,msg.occurred_at,left(coalesce(msg.text_content,'"'"''"'"'),80) text
FROM messages msg JOIN conversations c ON c.id=msg.conversation_id JOIN contacts co ON co.id=c.contact_id
WHERE co.phone_e164=:'"'"'phone'"'"'
ORDER BY msg.occurred_at DESC,msg.id DESC LIMIT 12;
SQL' </dev/null
          fi

          diagnostic=$(cat <<'NODE'
          const login = await fetch("http://gateway/api/v1/auth/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD }),
          });
          if (!login.ok) throw new Error(`login HTTP ${login.status}`);
          const { accessToken } = await login.json();
          const headers = { authorization: `Bearer ${accessToken}` };
          const conversations = await fetch("http://gateway/api/v1/conversations?limit=1", { headers });
          if (!conversations.ok) throw new Error(`conversations HTTP ${conversations.status}`);
          const list = await conversations.json();
          const id = list.data?.[0]?.id;
          if (!id) {
            console.log("No conversation is available for the CRM smoke test");
            process.exit(0);
          }
          for (const path of [`/api/v1/conversations/${id}/details`, "/api/v1/tags"]) {
            const response = await fetch(`http://gateway${path}`, { headers });
            console.log(`${path}: HTTP ${response.status}`);
            if (!response.ok) {
              console.error((await response.text()).slice(0, 2000));
              process.exitCode = 1;
            }
          }
          if (process.env.TTS_ACCOUNT_ID) {
            const response = await fetch("http://gateway/api/v1/text-to-speech", {
              method: "POST",
              headers: { ...headers, "content-type": "application/json" },
              body: JSON.stringify({
                accountId: process.env.TTS_ACCOUNT_ID,
                text: "RelayDesk text to speech provider diagnostic",
                speed: 1,
                instructions: "Use a natural and friendly customer-service tone",
              }),
            });
            console.log(`/api/v1/text-to-speech: HTTP ${response.status}`);
            const responseText = await response.text();
            console.log(responseText.slice(0, 2000));
            if (!response.ok) process.exitCode = 1;
          }
          if (process.env.TRANSLATION_MESSAGE_ID) {
            const response = await fetch("http://gateway/api/v1/translations/messages", {
              method: "POST",
              headers: { ...headers, "content-type": "application/json" },
              body: JSON.stringify({
                messageIds: [process.env.TRANSLATION_MESSAGE_ID],
                targetLanguage: "zh-CN",
                generateAudio: true,
              }),
            });
            const body = await response.json().catch(() => ({}));
            const item = body.data?.[0];
            console.log(`/api/v1/translations/messages: HTTP ${response.status}; status=${item?.status ?? "missing"}; sourceLength=${item?.sourceText?.length ?? 0}; translationLength=${item?.translatedText?.length ?? 0}`);
            if (!response.ok || item?.status !== "translated") {
              console.error(JSON.stringify({ error: item?.error ?? body.error, message: item?.message ?? body.message }));
              process.exitCode = 1;
            }
          }
          NODE
          )
          if ! docker compose -p relaydesk exec -T -e TTS_ACCOUNT_ID="$tts_account_id" -e TRANSLATION_MESSAGE_ID="$translation_message_id" api node --input-type=module -e "$diagnostic" </dev/null
          then
            docker compose -p relaydesk logs --since=15m --tail=300 api gateway
            docker compose -p relaydesk logs --tail=120 worker
            exit 1
          fi
          docker compose -p relaydesk logs --tail=120 worker
          REMOTE
