name: Diagnose PayPal tracking sync

on:
  workflow_dispatch:
    inputs:
      tracking_number:
        description: Saved order tracking number
        required: true
        type: string
      deploy_current:
        description: Emergency-deploy the current main revision before diagnosing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/relaydesk' }}
      WEB_PORT: ${{ secrets.WEB_PORT || '3200' }}
      TRACKING_NUMBER: ${{ inputs.tracking_number }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts

      - name: Check out current release
        if: inputs.deploy_current
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Emergency deploy current release
        if: inputs.deploy_current
        shell: bash
        run: |
          set -Eeuo pipefail
          git archive --format=tar.gz --output=release.tar.gz "$GITHUB_SHA"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_DEPLOY_PATH/incoming'"
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            release.tar.gz "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/incoming/$GITHUB_SHA.tar.gz"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -s -- '$VPS_DEPLOY_PATH' '$GITHUB_SHA' '$WEB_PORT'" <<'REMOTE'
          set -Eeuo pipefail
          root=$1
          sha=$2
          web_port=$3
          archive="$root/incoming/$sha.tar.gz"
          release="$root/releases/$sha"
          previous=$(readlink -f "$root/current" 2>/dev/null || true)

          rollback() {
            status=$?
            trap - ERR
            if [ -n "$previous" ] && [ -f "$previous/compose.yaml" ]; then
              cd "$previous"
              WEB_PORT="$web_port" docker compose -p relaydesk up --detach --build --remove-orphans --wait --wait-timeout 180 || true
            fi
            exit "$status"
          }
          trap rollback ERR

          test -f "$archive"
          mkdir -p "$release"
          tar -xzf "$archive" -C "$release"
          ln -sfn "$root/shared/.env" "$release/.env"
          cd "$release"
          WEB_PORT="$web_port" docker compose -p relaydesk config --quiet
          WEB_PORT="$web_port" docker compose -p relaydesk up --detach --remove-orphans postgres redis minio
          WEB_PORT="$web_port" docker compose -p relaydesk up minio-init
          WEB_PORT="$web_port" docker compose -p relaydesk up --detach --build --remove-orphans api worker web gateway
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null && curl --fail --silent "http://127.0.0.1:$web_port/" >/dev/null; then
              break
            fi
            [ "$attempt" -lt 90 ] || false
            sleep 2
          done
          WEB_PORT="$web_port" docker compose -p relaydesk exec -T api npm run backfill:conversation-summaries
          next_link="$root/.current-$sha"
          rm -f "$next_link"
          ln -s "$release" "$next_link"
          mv -Tf "$next_link" "$root/current"
          rm -f "$archive"
          trap - ERR
          REMOTE

      - name: Retry sync and capture PayPal response
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TRACKING_NUMBER" =~ ^[A-Za-z0-9._-]{1,160}$ ]]
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -s -- '$VPS_DEPLOY_PATH' '$TRACKING_NUMBER'" <<'REMOTE'
          set -Eeuo pipefail
          cd "$1/current"
          tracking_number=$2
          order_id=$(printf "SELECT id FROM orders WHERE tracking_number = '%s' AND deleted_at IS NULL ORDER BY updated_at DESC NULLS LAST, created_at DESC LIMIT 1;\n" "$tracking_number" | docker compose -p relaydesk exec -T postgres sh -lc \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atq')
          test -n "$order_id"
          [[ "$order_id" =~ ^[0-9a-f-]{36}$ ]]
          diagnostic=$(cat <<'NODE'
          const orderId = process.env.ORDER_ID;
          const login = await fetch("http://gateway/api/v1/auth/login", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD }),
          });
          if (!login.ok) throw new Error(`login HTTP ${login.status}`);
          const { accessToken } = await login.json();
          const response = await fetch(`http://gateway/api/v1/orders/${orderId}/tracking/sync-paypal`, {
            method: "POST",
            headers: { authorization: `Bearer ${accessToken}` },
          });
          console.log(`order=${orderId}; HTTP ${response.status}`);
          console.log((await response.text()).slice(0, 4000));
          if (!response.ok) process.exitCode = 1;
          NODE
          )
          set +e
          docker compose -p relaydesk exec -T -e ORDER_ID="$order_id" api node --input-type=module -e "$diagnostic" </dev/null
          sync_exit=$?
          if [ "$sync_exit" -ne 0 ]; then
            echo "Recent API log entries for this sync:"
            docker compose -p relaydesk logs --tail=80 api | grep -F "PayPal tracking sync failed" || true
          fi
          exit "$sync_exit"
          REMOTE
